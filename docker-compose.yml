services:
  backend:
    build:
      context: ./server
    container_name: ritwika-backend
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      CORS_ORIGIN: http://localhost

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    container_name: ritwika-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
